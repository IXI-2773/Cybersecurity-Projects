name: Check project catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check catalog links and Python syntax
        run: |
          python scripts/check_catalog.py
          python scripts/check_splunk_workflow.py
